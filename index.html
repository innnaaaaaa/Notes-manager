<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Менеджер нотаток</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <h1>Менеджер нотаток</h1>
        </header>

        <div class = "layout">
            <main>

                <section id = "new-note">
                    <h2>Нова нотатка</h2>
                    <form id = "note-form">
                        <label for = "note-title">Заголовок:</label>
                        <input type = "text" id = "note-title" name = "note-title" required>

                        <label for = "note-content">Зміст:</label>
                        <textarea id = "note-content" name = "note-content" required></textarea>

                        <button type="submit">Додати нотатку</button>
                    </form>
                </section>
        
                <section id = "notes-list">
                    <h2>Мої нотатки</h2>
                    <div class="cards">
                        <article>
                            <span class="note-category note-category--general">Навчання</span>
                            <h3>Нотатки з лекції</h3>
                            <p>Бази даних, PostgreSQL</p>
                        </article>

                        <article>
                            <span class="note-category note-category--security">Паролі</span>
                            <h3>Пароль від Wifi</h3>
                            <p>12345678</p>
                        </article>
                    </div>
                </section>

            </main>

            <aside>
                <h2>Перегляд обраної нотатки</h2>
            </aside>
        </div>

        <footer>
            <p>&copy; 2026 Менеджер нотаток. Розроблений в межах дисципліни "Програмування веб-застосунків".</p>
        </footer>

        <script src="js/app.js"></script>
    </body>
</html>
