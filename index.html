<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер нотаток</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <h1>Менеджер нотаток</h1>
    </header>

    <div id="app">
        <div class="layout">
            <main>
                <section id="new-note">
                    <h2>Нова нотатка</h2>
                    <form id="note-form" @submit.prevent="addNote">
                        <label class="form-label" for="note-title">Заголовок:</label>
                        <input class="form-control" type="text" id="note-title" v-model.trim="newTitle" required>

                        <label class="form-label" for="note-content">Зміст:</label>
                        <textarea class="form-control form-control--textarea" id="note-content" v-model="newContent" required maxlength="300"></textarea>
                        <p id="char-counter" class="char-counter" :class="{ 'near-limit': nearLimit }">{{ charsCount }} / {{ maxLength }}</p>

                        <button class="btn" type="submit">Додати нотатку</button>
                    </form>
                </section>

                <section id="notes-list">
                    <p id="notes-count">Усього нотаток: {{ notes.length }}</p>
                    <h2>Мої нотатки</h2>
                    <button id="refresh-btn" class="btn btn--secondary" :disabled="loading" @click="loadData">
                        {{ loading ? 'Завантаження...' : 'Оновити дані з API' }}
                    </button>
                    <p class="error-message" v-if="error">{{ error }}</p>

                    <div class="cards">
                        <note-card
                            v-for="note in notes"
                            :key="note.id"
                            :title="note.title"
                            :excerpt="note.excerpt"
                            :category="note.category"
                            @select="selectedNote = note">
                        </note-card>
                    </div>
                </section>
            </main>

            <aside>
                <h2>Перегляд обраної нотатки</h2>
                <template v-if="selectedNote">
                    <h3>{{ selectedNote.title }}</h3>
                    <p>{{ selectedNote.category }}</p>
                    <p>{{ selectedNote.excerpt }}</p>
                </template>
                <p v-else>Натисніть на нотатку, щоб переглянути її тут.</p>
            </aside>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Менеджер нотаток. Розроблений в межах дисципліни "Програмування веб-застосунків".</p>
    </footer>
</body>
</html>
